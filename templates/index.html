<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Games Hub</title>
    <style>
        * {
            cursor: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5e6;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .floating-word {
            position: absolute;
            color: #3e4c59;
            font-family: monospace;
            font-weight: bold;
            font-size: 18px;
            user-select: none;
            pointer-events: auto;
            transition: transform 0.2s ease-out, color 0.2s ease-out;
            animation: floatWord linear infinite;
        }
        .floating-word:hover {
            color: #e74c3c;
            transform: scale(1.3);
        }
        @keyframes floatWord {
            0% { transform: translateY(105vh) translateX(0); }
            100% { transform: translateY(-10vh) translateX(50px); }
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
            font-weight: 700;
            z-index: 2;
        }
        .menu-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 850px;
            z-index: 2;
        }
        .game-card {
            background: rgba(255, 230, 230, 0.95);
            padding: 30px 20px;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 18px;
            width: 230px;
            border: 2px solid #ffb3b3;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }
        .game-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 28px rgba(231, 76, 60, 0.2);
            border-color: #e74c3c;
            color: #c0392b;
        }
        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            background-color: #74b9ff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            box-shadow: 0 0 10px rgba(116, 185, 255, 0.8), 0 0 20px rgba(162, 213, 255, 0.5);
        }
        .sparkle {
            position: fixed;
            pointer-events: none;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffffff 0%, #74b9ff 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 9998;
            animation: sparkle-fade 0.6s linear forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(0.2) translateY(15px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="bg-words"></div>
    <div class="cursor-dot" data-cursor-dot></div>

    <h1>Select to Play 🎮</h1>
    <div class="menu-container">
        <a href="/guess_number" class="game-card">🔢 Guess the Number</a>
        <a href="/roll_dice" class="game-card">🎲 Roll Two Dice</a>
        <a href="/coin_flip" class="game-card">🪙 Coin Flip</a>
        <a href="/guess_word" class="game-card">🔤 Guess the Word</a>
        <a href="/rps" class="game-card">✂️ Rock Paper Scissors</a>
    </div>

    <script>
        const wordsList = [".py", "flask", "random", "module", "class", "def", "import", "session", "return", "route", "pip", "request", "debug", "object", "inheritance", "OOP", "math", "max", "min", "array", "NumPy", "pandas"];
        const bgContainer = document.getElementById("bg-words");

        for (let i = 0; i < 25; i++) {
            const span = document.createElement("span");
            span.classList.add("floating-word");
            span.innerText = wordsList[Math.floor(Math.random() * wordsList.length)];
            span.style.left = `${Math.random() * 90}vw`;
            span.style.top = `${Math.random() * 100}vh`;
            span.style.animationDuration = `${Math.random() * 8 + 6}s`;
            span.style.animationDelay = `${Math.random() * 5}s`;

            span.addEventListener("mouseenter", () => {
                const randomX = (Math.random() - 0.5) * 100;
                const randomY = (Math.random() - 0.5) * 100;
                span.style.transform = `translate(${randomX}px, ${randomY}px) scale(1.4)`;
            });

            span.addEventListener("mouseleave", () => {
                span.style.transform = "translate(0, 0) scale(1)";
            });

            bgContainer.appendChild(span);
        }

        const cursorDot = document.querySelector("[data-cursor-dot]");
        window.addEventListener("mousemove", (e) => {
            const posX = e.clientX;
            const posY = e.clientY;
            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            if (Math.random() < 0.4) {
                const sparkle = document.createElement("div");
                sparkle.classList.add("sparkle");
                sparkle.style.left = `${posX + (Math.random() * 12 - 6)}px`;
                sparkle.style.top = `${posY + (Math.random() * 12 - 6)}px`;
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 600);
            }
        });
    </script>
</body>
</html>
